name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        # Throwaway credentials for this ephemeral CI-only container; not a secret.
        env:
          POSTGRES_DB: usage_metering_test
          POSTGRES_USER: usage_metering
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        # The job's steps start only after this health check passes.
        options: >-
          --health-cmd "pg_isready --username usage_metering --dbname usage_metering_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://usage_metering:ci-only-password@localhost:5432/usage_metering_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and PostgreSQL integration tests with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

  container:
    name: Container image and Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node runs only the end-to-end check of the client's output on the host; the service and the
      # example client run in their images.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the production image
        run: docker build --target runtime --tag usage-metering-quota-service:ci .

      # Exactly what a reviewer runs: PostgreSQL, the service and the one-shot example client, which
      # Compose starts only once the service reports healthy.
      - name: Start the complete Compose stack from a fresh database volume
        run: |
          docker compose down --volumes --remove-orphans
          timeout 600 docker compose up --build --detach
          docker compose up --detach --wait --wait-timeout 180 postgres api

      # The client's output goes to a file first; the log shows only a redacted copy, and the raw
      # file is checked and scanned in the next steps.
      - name: Wait for the Compose example client to finish and require exit code 0
        shell: bash
        run: |
          cid="$(docker compose ps --all --quiet client)"
          if [ -z "${cid}" ]; then
            echo "::error::Compose did not create the example client container"
            exit 1
          fi
          set +e
          status="$(timeout 300 docker wait "${cid}")"
          wait_status=$?
          set -e
          docker compose logs --no-color --no-log-prefix client > client.log 2>&1
          sed -E 's/umqs_[A-Za-z0-9_-]+/umqs_[REDACTED]/g' client.log
          if [ "${wait_status}" != "0" ]; then
            echo "::error::the example client did not finish within 300 seconds"
            exit 1
          fi
          echo "CLIENT_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          echo "example client exit code: ${status}"
          if [ "${status}" != "0" ]; then
            echo "::error::the example client exited with code ${status}"
            exit 1
          fi

      - name: Check the example client's output for every required behavior
        shell: bash
        env:
          CLIENT_LOG: client.log
        run: |
          set +e
          timeout 120 npm run test:e2e > e2e.log 2>&1
          status=$?
          set -e
          sed -E 's/umqs_[A-Za-z0-9_-]+/umqs_[REDACTED]/g' e2e.log
          exit "${status}"

      - name: Verify both health endpoints from the host
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          echo
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          echo

      - name: Verify the service runs as a non-root user
        run: |
          uid="$(docker compose exec -T api id -u)"
          echo "api runs as uid ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::the api container runs as root"
            exit 1
          fi

      - name: Verify the example client runs as a non-root user with only its own files and no database settings
        shell: bash
        run: |
          image=usage-metering-quota-service-client:local
          uid="$(docker run --rm --entrypoint id "${image}" -u)"
          echo "client runs as uid ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::the example client image runs as root"
            exit 1
          fi
          docker run --rm --entrypoint node "${image}" -e '
            const fs = require("node:fs");
            const unexpected = ["src", "node_modules", "dist", "load", "tests"].filter((name) => fs.existsSync(name));
            if (unexpected.length > 0) {
              console.error("unexpected in the client image: " + unexpected.join(", "));
              process.exit(1);
            }
            console.log("client image /app: " + fs.readdirSync(".").sort().join(" "));
          '
          environment="$(docker inspect --format '{{json .Config.Env}}' "$(docker compose ps --all --quiet client)")"
          if grep -qE 'DATABASE_URL|POSTGRES_|local-development-only' <<< "${environment}"; then
            echo "::error::the example client received database settings"
            exit 1
          fi
          echo "the client container's environment holds no database setting"

      - name: Check the service logs and client output for errors and leaked credentials
        if: success() || failure()
        shell: bash
        run: |
          docker compose logs --no-color api > api.log
          for file in api.log client.log e2e.log; do
            if [ ! -f "${file}" ]; then
              continue
            fi
            if grep -qE 'umqs_[A-Za-z0-9_-]{8,}' "${file}"; then
              echo "::error::an API key appears in ${file}"
              exit 1
            fi
            if grep -q "local-development-only" "${file}"; then
              echo "::error::the database password appears in ${file}"
              exit 1
            fi
          done
          if grep -qE '"level":(50|60)' api.log; then
            echo "::error::the api logged errors"
            sed -E 's/umqs_[A-Za-z0-9_-]+/umqs_[REDACTED]/g' api.log
            exit 1
          fi
          echo "no API key, database password or error-level entry in api.log, client.log or e2e.log"

      - name: Stop the service and verify a graceful shutdown
        run: |
          docker compose stop api
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet api)")"
          echo "api exit code: ${exit_code}"
          docker compose logs --no-color api > api.log
          if [ "${exit_code}" != "0" ] || ! grep -q '"msg":"shutdown complete"' api.log; then
            echo "::error::the api did not shut down gracefully"
            sed -E 's/umqs_[A-Za-z0-9_-]+/umqs_[REDACTED]/g' api.log
            exit 1
          fi

      - name: Show all logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color | sed -E 's/umqs_[A-Za-z0-9_-]+/umqs_[REDACTED]/g'

      - name: Tear down
        if: always()
        run: docker compose down --volumes
