# Benchmark override, used only by load/scripts/benchmark.sh:
#
#   docker compose -p umqs-bench -f compose.yaml -f load/compose.benchmark.yaml …
#
# The separate project name keeps every container, network and volume of a benchmark apart from
# the development stack, so teardown removes exactly these. Images are pinned by digest, both
# containers get fixed CPU and memory limits, and PostgreSQL runs with explicit, recorded settings
# plus pg_stat_statements for per-statement attribution. The database name (POSTGRES_DB), password
# and host ports come from the environment the script sets; compose.yaml substitutes them.

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    cpus: 2.0
    mem_limit: 2g
    shm_size: 256m
    restart: "no"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=5min
      - -c
      - track_io_timing=on
      - -c
      - jit=off

  api:
    build:
      args:
        # The base image pinned by digest; the Dockerfile itself is unchanged.
        NODE_IMAGE: node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    image: umqs-bench-api:local
    cpus: 1.0
    mem_limit: 1g
